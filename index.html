<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conflict Geolocation Map</title>
    
    <!-- Leaflet CSS (지도 스타일) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* 기본 레이아웃 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e14;
        }

        /* 지도가 화면 전체를 차지하도록 설정 */
        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 상단 네비게이션 / 정보 오버레이 (OSINT 대시보드 느낌) */
        .header-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(16, 20, 24, 0.85);
            backdrop-filter: blur(8px);
            padding: 16px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            max-width: 320px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header-panel h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #ff4d4f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-panel p {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 6px;
            line-height: 1.4;
        }

        /* 펄스(깜빡이는) 분쟁 마커 스타일 */
        .pulse-marker {
            width: 14px;
            height: 14px;
            background-color: #ff3333;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 10px #ff0000;
        }

        .pulse-marker::after {
            content: '';
            position: absolute;
            top: -7px;
            left: -7px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background-color: rgba(255, 51, 51, 0.4);
            animation: pulse 1.5s infinite ease-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        /* 팝업 커스텀 */
        .leaflet-popup-content-wrapper {
            background: rgba(20, 24, 30, 0.95);
            color: #fff;
            border: 1px solid rgba(255, 77, 79, 0.3);
            border-radius: 6px;
        }
        .leaflet-popup-tip {
            background: rgba(20, 24, 30, 0.95);
        }
    </style>
</head>
<body>

    <!-- UI 오버레이 패널 -->
    <div class="header-panel">
        <h1><span>●</span> LIVE CONFLICT TRACKER</h1>
        <p>위성 지도 기반 분쟁 지역 모니터링 시스템입니다. 드래그하여 이동하고 마우스 휠로 확대/축소할 수 있습니다.</p>
    </div>

    <!-- 지도 표시 영역 -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. 지도 초기화 (초기 위치: 중동 및 동유럽 사이 전역 보기 적절한 좌표, 줌 레벨: 5)
        const map = L.map('map', {
            zoomControl: false // 커스텀 배치를 위해 기본 줌 컨트롤 일단 비활성화 (원하면 켤 수 있음)
        }).setView([35.0, 38.0], 5);

        // 줌 컨트롤을 우측 하단으로 재배치
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 2. Esri 고해상도 위성 베이스 타일 레이어
        const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri',
            maxZoom: 18
        }).addTo(map);

        // 3. 국경선 및 지명 라벨 레이어 (위성 사진 위에 얹어서 도시명과 국경이 보이게 함)
        const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Labels &copy; Esri',
            maxZoom: 18
        }).addTo(map);

        // 4. 지도 레이어 전환 컨트롤 (위성 단독 vs 위성+라벨)
        const baseMaps = {
            "위성 지도 (기본)": satellite
        };
        const overlayMaps = {
            "국경 및 지명 표시": labels
        };
        L.control.layers(baseMaps, overlayMaps, { position: 'topright' }).addTo(map);

        // ----------------------------------------------------
        // [예시] 분쟁 이벤트 마커 추가 (어디서 무슨 일이 일어나는지 표시)
        // ----------------------------------------------------
        const conflictEvents = [
            {
                coords: [33.5138, 36.2765], // 다마스쿠스 인근
                title: "공습 보고 접수",
                time: "10분 전",
                desc: "군사 기지 인근 폭발음 보고 및 레이더 교란 탐지."
            },
            {
                coords: [31.5017, 34.4668], // 가자 지구 인근
                title: "포격 및 교전 발생",
                time: "1시간 전",
                desc: "국경 인근 국지적 교전 지속 중."
            }
        ];

        // 커스텀 펄스 아이콘 생성 함수
        const createPulseIcon = () => {
            return L.divIcon({
                className: '',
                html: '<div class="pulse-marker"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });
        };

        // 이벤트 데이터를 순회하며 지도에 마커 등록
        conflictEvents.forEach(event => {
            const popupContent = `
                <div style="font-size: 13px;">
                    <div style="color: #ff4d4f; font-weight: bold; margin-bottom: 4px;">⚠️ ${event.title}</div>
                    <div style="color: #8c8c8c; font-size: 11px; margin-bottom: 6px;">발생 시간: ${event.time}</div>
                    <div>${event.desc}</div>
                </div>
            `;

            L.marker(event.coords, { icon: createPulseIcon() })
                .addTo(map)
                .bindPopup(popupContent);
        });
    </script>
</body>
</html>
